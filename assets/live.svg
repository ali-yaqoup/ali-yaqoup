<svg xmlns="http://www.w3.org/2000/svg" width="86" height="22" viewBox="0 0 86 22" role="img" aria-label="Available">
  <rect width="86" height="22" rx="11" fill="#06281F"/>
  <circle cx="12" cy="11" r="4" fill="#34D399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.4;4.2;3.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="11" r="7" fill="#34D399" fill-opacity="0.22">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="15" text-anchor="middle" fill="#6EE7B7" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">AVAILABLE</text>
</svg>
