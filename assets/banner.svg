<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ali Yaqoub  Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="45%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#22D3EE;#A78BFA;#4F46E5" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#4F46E5;#22D3EE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#4F46E5;#22D3EE;#A78BFA" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <ellipse cx="220" cy="70" rx="210" ry="140" fill="url(#orbA)" filter="url(#soft)">
      <animate attributeName="cx" values="220;280;220" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="300" rx="240" ry="150" fill="url(#orbB)" filter="url(#soft)">
      <animate attributeName="cx" values="980;920;980" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;240;300" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="40" rx="180" ry="110" fill="url(#orbC)" filter="url(#soft)">
      <animate attributeName="cy" values="40;90;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="0" y="0" width="1200" height="3" fill="url(#aurora)"/>

    <path d="M36 36h28M36 36v28" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <path d="M1164 36h-28M1164 36v28" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 324h28M36 324v-28" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M1164 324h-28M1164 324v-28" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

    <text x="600" y="118" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="6">FULL-STACK DEVELOPER  ·  SOFTWARE ENGINEERING</text>
    <text x="600" y="188" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="8">ALI YAQOUB</text>

    <rect x="470" y="208" width="260" height="3" rx="2" fill="url(#aurora)">
      <animate attributeName="width" values="140;260;140" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="530;470;530" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="208" width="90" height="3" fill="url(#sheen)" opacity="0.8">
      <animate attributeName="x" values="430;680;430" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="600" y="258" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1.5">React · Angular · Node.js · Laravel · Figma</text>
    <text x="600" y="298" text-anchor="middle" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">AN-NAJAH NATIONAL UNIVERSITY  ·  PALESTINE</text>
  </g>
</svg>
